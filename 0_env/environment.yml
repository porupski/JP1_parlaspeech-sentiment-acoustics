name: jp1_ps_sent
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip

  # --- numerics / stats ---
  - numpy>=2.0
  - pandas>=2.2
  - scipy>=1.15
  - statsmodels>=0.14
  - patsy>=1.0        # formula parsing (used by statsmodels)
  - joblib>=1.4

  # --- visualization ---
  - matplotlib>=3.10
  - seaborn>=0.13
  - adjusttext>=1.3   # non-overlapping labels in plots

  # --- audio loading (Praat extraction) ---
  - librosa>=0.11
  - pysoundfile>=0.13

  # --- R bridge (GAMM; disabled by default in config.json) ---
  - r-base=4.4
  - rpy2=3.6

  # --- utilities ---
  - tqdm>=4.67
  - pyyaml>=6.0
  - loguru>=0.7
  - requests>=2.32

  # --- testing ---
  - pytest>=9.0

  - pip:
      # Praat via Python
      - praat-parselmouth==0.4.5

      # OpenSMILE GeMAPS (appendix track)
      - opensmile==2.5.1

      # Editorial notebooks (jupytext # %% → .ipynb)
      - jupytext>=1.19
      - ipykernel>=6.30
      - ipython>=9.7

      # Transformers stack (used if enable_audio_vad=true; light enough to keep)
      - transformers>=4.57
      - huggingface-hub>=0.36
      - sentencepiece>=0.2
      - tokenizers>=0.22

      # Table formatting
      - tabulate>=0.9
